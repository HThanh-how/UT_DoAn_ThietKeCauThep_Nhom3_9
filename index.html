<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đồ án thiết kế cầu thép</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23034ea2' d='M6 48h52v8H6zM12 42h8V26h-8zm32 0h8V26h-8zM22 42h20V30H22zM8 24h48v-6H8z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Urbanist:wght@400;700;800&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/slides.css" />
    <link rel="stylesheet" href="css/presentation-tools.css" />
  </head>
  <body>
    <div id="loading" style="position: fixed; inset: 0; background: #000; color: white; display: flex; align-items: center; justify-content: center; z-index: 9999;">
      <div style="text-align: center;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 3rem; margin-bottom: 20px;"></i>
        <h2>Đang tải bài thuyết trình...</h2>
        <p id="loading-text" style="color: #888;">Vui lòng chờ trong giây lát...</p>
      </div>
    </div>

    <main id="slides_wrapper"></main>

    <div id="controls">
      <button class="btn" onclick="prevSlide()" title="Slide trước"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="btn" onclick="togglePresentation()" title="Trình chiếu"><i class="fa-solid fa-play"></i></button>
      <button class="btn" onclick="nextSlide()" title="Slide tiếp theo"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <div id="counter">1 / --</div>

    <script src="js/presentation.js"></script>
    <script src="js/presentation-tools.js"></script>
  </body>
</html>
